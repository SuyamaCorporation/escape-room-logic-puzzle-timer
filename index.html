<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room Logic Puzzles</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4">
<div class="max-w-2xl mx-auto">
  <!-- Header -->
  <div class="flex justify-between items-start mb-5">
    <div>
      <h1 class="text-2xl font-bold text-red-400">Escape Room</h1>
      <p class="text-gray-400 text-sm">Solve 5 puzzles before time runs out!</p>
    </div>
    <div class="text-right">
      <div id="timerDisplay" class="text-4xl font-mono font-bold text-red-300 tabular-nums">60:00</div>
      <div class="text-xs text-gray-500">remaining</div>
    </div>
  </div>

  <!-- Progress -->
  <div class="flex gap-2 mb-5" id="progressBar"></div>

  <!-- Puzzle area -->
  <div id="puzzleArea"></div>

  <!-- Result -->
  <div id="resultArea" class="hidden"></div>
</div>

<script>
// Puzzle definitions
// Puzzle 1: sum all digits of given number
const P1_NUM = 3847;
const P1_ANS = String(P1_NUM).split('').reduce((a,c)=>a+parseInt(c),0); // 22

// Puzzle 2: color sequence
const COLORS2 = ['Red','Blue','Green'];
const P2_SEQ = [COLORS2[0],COLORS2[2],COLORS2[1]]; // Red, Green, Blue
const P2_ANS = P2_SEQ.map(c=>c[0]).join(''); // RGB

// Puzzle 3: anagram
const P3_WORD = 'STONE'; const P3_ANAGRAM = 'NOTES';

// Puzzle 4: algebra  3x + 5 = 20 → x=5
const P4_ANS = 5;

// Puzzle 5: combine answers from 1-4
// Code = P1_ANS (22) + '-' + P2_SEQ[2][0] (B) + '-' + P4_ANS (5)
const P5_ANS = `${P1_ANS}-${P2_SEQ[2][0]}-${P4_ANS}`.toUpperCase();

let answers = {};         // puzzle idx → answer string
let hints = {};           // puzzle idx → hints unlocked count
let currentPuzzle = 0;    // 0-4
let timeLeft = 60*60;     // seconds
let timerId = null;
let startTime = null;
let finished = false;
let hintsUsed = 0;

const PUZZLES = [
  {
    title:'Puzzle 1 — The Cipher Lock',
    description:`The ancient dial is engraved with the number <span class="font-mono text-yellow-300 text-2xl">${P1_NUM}</span>. Add all its digits together to find the first code.`,
    placeholder:'Enter the sum',
    answer: String(P1_ANS),
    hints:[
      `The number has ${String(P1_NUM).length} digits.`,
      `Add: ${String(P1_NUM).split('').join(' + ')} = ?`,
      `The answer is ${P1_ANS}.`
    ]
  },
  {
    title:'Puzzle 2 — The Color Sequence',
    description:`Three lamps flash in order: <span class="text-red-400 font-bold">Red</span>, <span class="text-green-400 font-bold">Green</span>, <span class="text-blue-400 font-bold">Blue</span>. Enter the <em>initials</em> of the sequence (e.g. RBG).`,
    placeholder:'3 letters (e.g. RGB)',
    answer: P2_ANS,
    hints:[
      'Each color starts with a unique letter: R, G, or B.',
      `The sequence is: ${P2_SEQ.join(', ')}.`,
      `Answer: ${P2_ANS}`
    ]
  },
  {
    title:'Puzzle 3 — The Scrambled Word',
    description:`Rearrange the letters <span class="font-mono text-yellow-300 text-2xl tracking-widest">${P3_ANAGRAM}</span> to form a 5-letter word.`,
    placeholder:'5-letter word',
    answer: P3_WORD,
    hints:[
      `It starts with the letter "${P3_WORD[0]}".`,
      `It ends with "${P3_WORD[P3_WORD.length-1]}" and is a type of rock or gem.`,
      `Answer: ${P3_WORD}`
    ]
  },
  {
    title:'Puzzle 4 — The Equation Wall',
    description:`Solve the equation inscribed on the wall:<br><span class="font-mono text-yellow-300 text-2xl">3x + 5 = 20</span><br>What is x?`,
    placeholder:'Enter x',
    answer: String(P4_ANS),
    hints:[
      'Subtract 5 from both sides first.',
      '3x = 15, so x = ?',
      `Answer: ${P4_ANS}`
    ]
  },
  {
    title:'Puzzle 5 — The Final Combination',
    description:`The exit lock requires a combination using your previous answers:<br>
      <span class="text-gray-400 text-sm">[ Sum from Puzzle 1 ] - [ 3rd color initial from Puzzle 2 ] - [ x from Puzzle 4 ]</span><br>
      <span class="text-xs text-gray-500">Format: number-letter-number (e.g. 10-A-3)</span>`,
    placeholder:`e.g. ${P1_ANS}-B-${P4_ANS}`,
    answer: P5_ANS,
    hints:[
      `Use your answer from Puzzle 1 first.`,
      `The 3rd color in sequence was ${P2_SEQ[2]}, so its initial is ${P2_SEQ[2][0]}.`,
      `Full answer: ${P5_ANS}`
    ]
  }
];

function pad(n){ return String(n).padStart(2,'0'); }

function startTimer() {
  startTime = Date.now();
  timerId = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    timeLeft = Math.max(0, 60*60 - elapsed);
    updateTimer();
    if (timeLeft === 0 && !finished) {
      finished = true;
      clearInterval(timerId);
      showResult(false, 'Time\'s up!');
    }
  }, 500);
}

function updateTimer() {
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  const el = document.getElementById('timerDisplay');
  el.textContent = `${pad(m)}:${pad(s)}`;
  el.className = 'text-4xl font-mono font-bold tabular-nums ' + (timeLeft < 300 ? 'text-red-500 animate-pulse' : 'text-red-300');
}

function renderProgress() {
  const bar = document.getElementById('progressBar');
  bar.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const div = document.createElement('div');
    const solved = answers[i] !== undefined;
    const active = i === currentPuzzle;
    div.className = 'flex-1 h-2 rounded-full transition ' +
      (solved ? 'bg-green-500' : active ? 'bg-yellow-500' : 'bg-gray-700');
    bar.appendChild(div);
  }
}

function renderPuzzle() {
  renderProgress();
  if (finished) return;
  const puzzle = PUZZLES[currentPuzzle];
  const hintsUnlocked = hints[currentPuzzle] || 0;
  const puzzleArea = document.getElementById('puzzleArea');

  let hintHtml = '';
  for (let i = 0; i < hintsUnlocked; i++) {
    hintHtml += `<div class="bg-yellow-900/30 border border-yellow-700 rounded p-2 text-sm text-yellow-200 mb-1">
      <span class="text-yellow-500 font-bold text-xs">HINT ${i+1}:</span> ${puzzle.hints[i]}
    </div>`;
  }

  puzzleArea.innerHTML = `
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-5 mb-4">
      <div class="flex justify-between items-start mb-3">
        <h2 class="font-bold text-yellow-300 text-lg">${puzzle.title}</h2>
        <span class="text-xs text-gray-500">${currentPuzzle+1} / 5</span>
      </div>
      <p class="text-gray-200 mb-4 leading-relaxed">${puzzle.description}</p>

      ${hintHtml}

      <div class="flex gap-3 mt-4">
        <div class="flex-1">
          <label for="answerInput" class="sr-only">Your answer</label>
          <input type="text" id="answerInput" placeholder="${puzzle.placeholder}"
            class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2.5 text-lg focus:outline-none focus:border-yellow-400"
            oninput="clearFeedback()"
            onkeydown="if(event.key==='Enter') checkAnswer()">
        </div>
        <button onclick="checkAnswer()" class="bg-yellow-600 hover:bg-yellow-500 text-white font-bold px-5 rounded-lg transition">Submit</button>
      </div>
      <div id="feedback" class="text-sm mt-2 h-5"></div>

      <div class="flex justify-between items-center mt-4 pt-3 border-t border-gray-800">
        <div class="text-xs text-gray-500">Hints used: <span class="text-yellow-400">${hintsUsed}</span> (−5 min each)</div>
        ${hintsUnlocked < 3 ? `<button onclick="useHint()" class="text-xs bg-gray-800 hover:bg-gray-700 border border-gray-600 text-gray-300 px-3 py-1.5 rounded transition">
          Use Hint ${hintsUnlocked+1}/3 (−5 min)
        </button>` : '<span class="text-xs text-gray-600">All hints used</span>'}
      </div>
    </div>
  `;

  setTimeout(() => document.getElementById('answerInput')?.focus(), 50);
}

function clearFeedback() {
  const el = document.getElementById('feedback');
  if (el) el.textContent = '';
}

function checkAnswer() {
  if (finished) return;
  const input = document.getElementById('answerInput');
  if (!input) return;
  const val = input.value.trim().toUpperCase();
  const puzzle = PUZZLES[currentPuzzle];
  const fb = document.getElementById('feedback');

  if (val === puzzle.answer.toUpperCase()) {
    answers[currentPuzzle] = val;
    fb.className = 'text-sm mt-2 text-green-400';
    fb.textContent = '✓ Correct!';
    setTimeout(() => {
      if (currentPuzzle < 4) {
        currentPuzzle++;
        renderPuzzle();
      } else {
        finished = true;
        clearInterval(timerId);
        const elapsed = 3600 - timeLeft;
        showResult(true, `Escaped in ${pad(Math.floor(elapsed/60))}:${pad(elapsed%60)}!`);
      }
    }, 600);
  } else {
    fb.className = 'text-sm mt-2 text-red-400';
    fb.textContent = '✗ Incorrect, try again.';
    input.select();
  }
}

function useHint() {
  if (timeLeft <= 0) return;
  const cur = currentPuzzle;
  const used = hints[cur] || 0;
  if (used >= 3) return;
  hints[cur] = used + 1;
  hintsUsed++;
  // Deduct 5 minutes
  timeLeft = Math.max(0, timeLeft - 300);
  renderPuzzle();
}

function showResult(success, msg) {
  document.getElementById('puzzleArea').innerHTML = '';
  renderProgress();
  const elapsed = 3600 - timeLeft;
  const resultArea = document.getElementById('resultArea');
  resultArea.classList.remove('hidden');
  resultArea.innerHTML = `
    <div class="bg-gray-900 border ${success?'border-green-600':'border-red-700'} rounded-xl p-8 text-center">
      <div class="text-6xl mb-4">${success ? '🔓' : '🔒'}</div>
      <h2 class="text-2xl font-bold ${success?'text-green-400':'text-red-400'} mb-2">${success ? 'ESCAPED!' : 'TRAPPED!'}</h2>
      <p class="text-gray-300 text-lg mb-4">${msg}</p>
      <div class="bg-gray-800 rounded-lg p-4 inline-block text-sm text-left mb-6 min-w-[200px]">
        <div class="text-gray-400 mb-2 font-semibold">Summary</div>
        <div class="text-gray-200">Puzzles solved: <span class="text-green-400 font-bold">${Object.keys(answers).length} / 5</span></div>
        <div class="text-gray-200">Hints used: <span class="text-yellow-400 font-bold">${hintsUsed}</span> (−${hintsUsed*5} min)</div>
        <div class="text-gray-200">Time elapsed: <span class="font-bold">${pad(Math.floor(elapsed/60))}:${pad(elapsed%60)}</span></div>
      </div>
      <div>
        <button onclick="restart()" class="bg-red-700 hover:bg-red-600 text-white font-bold px-8 py-3 rounded-xl text-lg transition">Play Again</button>
      </div>
    </div>
  `;
}

function restart() {
  clearInterval(timerId);
  answers = {}; hints = {}; currentPuzzle = 0; timeLeft = 60*60;
  finished = false; hintsUsed = 0; startTime = null;
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('timerDisplay').textContent = '60:00';
  renderPuzzle();
  startTimer();
}

// Init
renderPuzzle();
startTimer();
</script>
</body>
</html>
